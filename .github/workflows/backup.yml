name: Daily backup

# Every night (and whenever started by hand) saves the whole site in two places:
#   1. a GitHub Release called "Backup YYYY-MM-DD" (under "Releases" on the repository page)
#   2. Cloudflare R2, the bucket "nrgfm-backups" (Cloudflare dashboard → R2), in a folder per day
# Each backup has two files:
#   nrgfm-files-<date>.zip       every file of the site as it is then (code, data, tags, change log)
#   nrgfm-history-<date>.bundle  the full history of every change (restore with: git clone nrgfm-history-<date>.bundle)
# Kept: the last 14 days, plus every Sunday's backup for good (and the weekly ones from before 19 Nov 2026).
# Older daily ones are deleted in both places.
# Cloudflare needs the secrets CLOUDFLARE_API_TOKEN (with R2 edit access) and CLOUDFLARE_ACCOUNT_ID;
# if R2 can't be reached the GitHub copy is still made and the run says why.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUCKET: nrgfm-backups
      KEEP_DAYS: "14"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make the backup files
        run: |
          d=$(date -u +%F)
          echo "D=$d" >> $GITHUB_ENV
          git archive --format=zip -o "nrgfm-files-$d.zip" HEAD
          git bundle create "nrgfm-history-$d.bundle" --all
          ls -la nrgfm-*
      - name: GitHub — save as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "backup-$D" "nrgfm-files-$D.zip" "nrgfm-history-$D.bundle" \
            --title "Backup $D" --notes "Daily backup: all site files plus the full change history." --latest=false \
          || gh release upload "backup-$D" "nrgfm-files-$D.zip" "nrgfm-history-$D.bundle" --clobber
      - name: GitHub — delete old daily backups (Sundays stay)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cut=$(date -u -d "$KEEP_DAYS days ago" +%F)
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | grep '^backup-' | while read t; do
            d=${t#backup-}
            [[ "$d" < "$cut" ]] || continue
            [[ "$d" < "2026-11-19" ]] && continue   # (the weekly backups from before stay)
            [ "$(date -u -d "$d" +%u)" = 7 ] && continue
            echo "deleting $t"; gh release delete "$t" --yes --cleanup-tag
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cloudflare — save to R2 (and delete old daily backups there)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "No Cloudflare secrets: only the GitHub copy."; exit 0; fi
          W="npx --yes wrangler@4"
          $W r2 bucket list 2>&1 | grep -q "name:\s*$BUCKET" || $W r2 bucket create "$BUCKET"
          for f in "nrgfm-files-$D.zip" "nrgfm-history-$D.bundle"; do
            $W r2 object put "$BUCKET/$D/$f" --file "$f" --remote
          done
          echo "Saved to R2: $BUCKET/$D/"
          cut=$(date -u -d "$KEEP_DAYS days ago" +%F)
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$BUCKET/objects"
          curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api?per_page=1000" | jq -r '.result[].key' | while read k; do
            d=${k%%/*}
            [[ "$d" < "$cut" ]] || continue
            [ "$(date -u -d "$d" +%u)" = 7 ] && continue
            echo "deleting $k"; $W r2 object delete "$BUCKET/$k" --remote
          done
