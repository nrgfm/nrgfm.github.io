name: Debug Lookup (temporary)
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: |
          set +e
          W="npx --yes wrangler@4"
          cd worker
          id=$($W d1 list --json | jq -r '.[] | select(.name=="nrgfm-activity") | .uuid'); sed -i "s/DATABASE_ID/$id/" wrangler.toml
          q() { $W d1 execute nrgfm-activity --remote --json --command "$1" 2>/dev/null | jq -c 'if type=="array" then .[0].results else . end'; }
          old=$(q "SELECT v FROM settings WHERE k='upkey'" | jq -r '.[0].v'); [ -n "$old" ] && [ "$old" != null ] || { echo no-old-key; exit 1; }
          K=$(openssl rand -hex 24); H=$(printf %s "$K" | sha256sum | cut -d' ' -f1)
          q "UPDATE settings SET v='$H' WHERE k='upkey'" >/dev/null
          T=$(q "SELECT id FROM lookup WHERE read_ts IS NULL ORDER BY ts LIMIT 1" | jq -r '.[0].id'); echo "test $T"
          start=$(date +%s); curl -s -m 170 -X POST https://nrgfm-activity.nrgfm.workers.dev/lookup/read -H "Authorization: Upload $K" -H "Content-Type: text/plain" -d "{\"id\":\"$T\"}"; echo " ($(( $(date +%s) - start )) s)"
          q "UPDATE settings SET v='$old' WHERE k='upkey'" >/dev/null
          q "SELECT read_err, length(lines) AS n FROM lookup WHERE id='$T'"
