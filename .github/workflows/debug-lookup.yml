name: Debug Lookup (temporary)
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          G=https://generativelanguage.googleapis.com
          curl -s -H "x-goog-api-key: $KEY" "$G/v1beta/models?pageSize=200" | jq -r '.models[] | select(.supportedGenerationMethods | index("generateContent")) | .name' | grep -i flash
          f=icons/logo-512.png; n=$(stat -c%s $f)
          up=$(curl -s -D - -o /dev/null -X POST "$G/upload/v1beta/files" -H "x-goog-api-key: $KEY" -H "X-Goog-Upload-Protocol: resumable" -H "X-Goog-Upload-Command: start" -H "X-Goog-Upload-Header-Content-Length: $n" -H "X-Goog-Upload-Header-Content-Type: image/png" -H "Content-Type: application/json" -d '{"file":{"display_name":"t"}}' | grep -i x-goog-upload-url | cut -d' ' -f2 | tr -d '\r')
          uri=$(curl -s -X POST "$up" -H "X-Goog-Upload-Offset: 0" -H "X-Goog-Upload-Command: upload, finalize" --data-binary @$f | jq -r .file.uri)
          echo "uri ok: ${uri:0:40}"
          for m in $(curl -s -H "x-goog-api-key: $KEY" "$G/v1beta/models?pageSize=200" | jq -r '.models[] | select(.supportedGenerationMethods | index("generateContent")) | .name' | grep -E 'gemini-[0-9.]+-flash(-lite)?$'); do
            for th in none budget0 minimal; do
              case $th in none) gc='{"temperature":0,"responseMimeType":"application/json"}';; budget0) gc='{"temperature":0,"responseMimeType":"application/json","thinkingConfig":{"thinkingBudget":0}}';; minimal) gc='{"temperature":0,"responseMimeType":"application/json","thinkingConfig":{"thinkingLevel":"minimal"}}';; esac
              s=$(date +%s%N); r=$(curl -s -m 100 -w " HTTP%{http_code}" -X POST "$G/v1beta/$m:generateContent" -H "x-goog-api-key: $KEY" -H "Content-Type: application/json" -d "{\"contents\":[{\"role\":\"user\",\"parts\":[{\"file_data\":{\"mime_type\":\"image/png\",\"file_uri\":\"$uri\"}},{\"text\":\"Write every line of text in the image. JSON {\\\"lines\\\":[]}\"}]}],\"generationConfig\":$gc}")
              echo "$m $th $(( ($(date +%s%N)-s)/1000000 )) ms: $(echo "$r" | tr -d '\n' | sed 's/  */ /g' | cut -c1-160) ... ${r: -8}"
            done
          done
