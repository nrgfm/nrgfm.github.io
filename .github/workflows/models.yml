name: Gemini models (temporary)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      K: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          G=https://generativelanguage.googleapis.com/v1beta
          for m in gemini-3.8-flash gemini-3.5-flash-lite; do
            b='{"contents":[{"role":"user","parts":[{"text":"Shocking Blue - Send Me A Postcard: original release, year, country. Answer JSON [{\"rl\":..,\"y\":..,\"co\":..,\"conf\":..}]"}]}],"tools":[{"google_search":{}}],"generationConfig":{"maxOutputTokens":2000,"thinkingConfig":{"thinkingLevel":"low"}}}'
            r=$(curl -s -m 120 -w "\nHTTP%{http_code}" -X POST "$G/models/$m:generateContent" -H "x-goog-api-key: $K" -H "Content-Type: application/json" -d "$b")
            code=$(echo "$r" | tail -1); body=$(echo "$r" | head -n -1)
            echo "== $m $code queries=$(echo "$body" | jq -c '[.candidates[0].groundingMetadata.webSearchQueries]') usage=$(echo "$body" | jq -c '.usageMetadata')"
            echo "$body" | jq -r '(.candidates[0].content.parts | map(select(.thought|not) | .text // "") | join(" ")) // .error.message' | tr '\n' ' ' | cut -c1-300; echo
          done
          cd scripts && python3 -c "import budget; print('budget now:', budget.now()); print(budget.allowed('gemini-3.5-flash-lite', 20000, 6000, 40))"
